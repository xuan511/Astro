name: Check, build and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR checks can stop; an active production deployment must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve origin and repository base path
        run: node scripts/github-env.mjs
        env:
          REQUESTED_SITE: ${{ vars.SITE_URL }}
          REQUESTED_BASE: ${{ vars.BASE_PATH }}
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run test:built
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration (Settings → Pages → GitHub Actions)
        uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
