name: Check, build and deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Superseded PR checks can stop; an active production deployment must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve origin and repository base path
        run: node scripts/github-env.mjs
        env:
          REQUESTED_SITE: ${{ vars.SITE_URL }}
          REQUESTED_BASE: ${{ vars.BASE_PATH }}
      - name: Validate types, architecture, tests and built pages
        run: npm run verify
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  format:
    name: Formatting advice
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check code formatting (advisory only)
        id: prettier
        continue-on-error: true
        run: npm run format:check
      - name: Explain formatting advice
        if: steps.prettier.outcome == 'failure'
        shell: bash
        run: |
          echo '::notice title=Formatting advice::Formatting differences do not block Pages deployment. Article content is excluded. Run Prettier on edited code files when convenient.'
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Formatting advice

          Prettier found code formatting differences or could not finish its check.
          This advice does **not** block the build or Pages deployment.
          Article content in `src/content/` is excluded from formatting checks.
          Review the formatting log, then optionally run `npm exec prettier -- --write <edited-code-file>`.
          Types, content validation, architecture, tests and built pages remain required.
          SUMMARY

  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:pages -- --repo=${{ github.repository }}

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, paths]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration (Settings → Pages → GitHub Actions)
        uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
